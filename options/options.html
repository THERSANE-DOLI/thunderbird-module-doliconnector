<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>Dolibarr Params</title>
	<link rel="stylesheet" type="text/css" media="screen" href="options.css">
</head>

<body>
<div class="option-page">

	<form>
		<table class="dolibarr-table" >
			<tr>
				<td><label id="label-for-dolibarr-api-url" for="dolibarr-api-url">__MSG_dolibarrUrl__</label></td>
				<td><input class="dol-input" type="text" id="dolibarr-api-url" name="dolibarr-api-url" /></td>
			</tr>

			<tr>
				<td>
					<label id="label-for-dolibarr-api-key" for="dolibarr-api-key">__MSG_dolibarrApiKey__</label>
					<br/><small id="label-api-key-encrypted-info" style="color: #27ae60;"></small>
				</td>
				<td><input class="dol-input" type="password" id="dolibarr-api-key" name="dolibarr-api-key" /></td>
			</tr>
			
			<tr>
				<td><label id="label-for-dolibarr-api-entity" for="dolibarr-api-entity">__MSG_dolibarrApiEntity__</label></td>
				<td><input class="dol-input" type="number" step="1" min="1" id="dolibarr-api-entity" name="dolibarr-api-entity" /></td>
			</tr>

			<tr>
				<td><label id="label-for-dolibarr-search-domain" for="dolibarr-search-domain">__MSG_dolibarrOptSearchDomain__</label></td>
				<td>
					<label class="dol-input-swith" >
						<input type="checkbox" class="dol-input" id="dolibarr-search-domain" name="dolibarr-search-domain" />
						<span class="dol-input-slider"></span>
					</label>
				</td>
			</tr>

			<tr>
				<td>
					<label id="label-for-dolibarr-use-notes" for="dolibarr-use-notes">__MSG_dolibarr-use-notes__</label>
					<br/><small id="label-for-dolibarr-use-notes_desc" ></small>
				</td>
				<td>
					<label class="dol-input-swith" >
						<input type="checkbox" class="dol-input" id="dolibarr-use-notes" name="dolibarr-use-notes" />
						<span class="dol-input-slider"></span>
					</label>
				</td>
			</tr>

			<tr>
				<td>
					<label id="label-for-dolibarr-use-gravatar" for="dolibarr-use-gravatar">__MSG_DolibarrUseGravatar__</label>
					<br/><small id="label-for-dolibarr-use-gravatar_desc" ></small>
				</td>
				<td>
					<label class="dol-input-swith" >
						<input type="checkbox" class="dol-input" id="dolibarr-use-gravatar" name="dolibarr-use-gravatar" />
						<span class="dol-input-slider"></span>
					</label>
				</td>
			</tr>
		</table>

		<details class="dolibarr-connector-detail" style="margin-top: 20px;">
			<summary id="security-options-title">
				__MSG_SecurityOptions__
			</summary>

			<table class="dolibarr-table" style="margin-top: 10px;">
				<tr>
					<td>
						<label id="label-for-use-master-password" for="use-master-password">__MSG_UseMasterPassword__</label>
						<br/><small id="label-for-use-master-password_desc" ></small>
					</td>
					<td>
						<label class="dol-input-swith" >
							<input type="checkbox" class="dol-input" id="use-master-password" name="use-master-password" />
							<span class="dol-input-slider"></span>
						</label>
					</td>
				</tr>

				<tr id="master-password-row" style="display: none;">
					<td><label id="label-for-master-password" for="master-password">__MSG_MasterPassword__</label></td>
					<td><input class="dol-input" type="password" id="master-password" name="master-password" placeholder="" /></td>
				</tr>

				<tr id="confirm-password-row" style="display: none;">
					<td><label id="label-for-confirm-master-password" for="confirm-master-password">__MSG_ConfirmMasterPassword__</label></td>
					<td>
						<input class="dol-input" type="password" id="confirm-master-password" name="confirm-master-password" placeholder="" />
						<div id="password-error" style="color: #e74c3c; font-size: 12px; margin-top: 5px;"></div>
					</td>
				</tr>
			</table>
		</details>

		<table class="dolibarr-table" style="margin-top: 20px;">

<!--			<tr>-->
<!--				<td><label id="label-for-toggle-main-btn-display" for="dolibarr-toggle-main-btn-display">__MSG_dolibarrOptMainBtnDisplay__</label></td>-->
<!--				<td>-->
<!--					<label class="dol-input-swith" >-->
<!--						<select type="checkbox" class="dol-input" id="dolibarr-toggle-main-btn-display" name="dolibarr-search-domain" >-->
<!--							<option id="toggle-main-btn-display-menu" value="menu" >Email menu (default)</option>-->
<!--							<option id="toggle-main-btn-display-top-bar" value="topbar" >Top Thunderbird Bar</option>-->
<!--						</select>-->
<!--					</label>-->
<!--				</td>-->
<!--			</tr>-->
		</table>


		<details class="dolibarr-connector-detail">
			<summary id="more-propal-option-title" >
				More quotation option
			</summary>

			<p id="dolibarr-propal">__MSG_dolibarrPropal__</p>
			<div>
				<!-- 	const STATUS_CANCELED = -1; -->
				<label class="label-badge" for="dolibarr-propal-canceled">
					<input class="dol-input" type="checkbox" value="-1"  id="dolibarr-propal-canceled" name="dolibarr-propal-canceled" />
					<span  id="label-for-dolibarr-propal-canceled" >__MSG_dolibarrCanceled__</span>
				</label>

				<!-- 	const STATUS_DRAFT = 0; -->
				<label class="label-badge"  for="dolibarr-propal-draft">
					<input class="dol-input" type="checkbox" value="0"  id="dolibarr-propal-draft" name="dolibarr-propal-draft" />
					<span id="label-for-dolibarr-propal-draft" >__MSG_dolibarrDraft__</span>
				</label>
					
				<!-- 	const STATUS_VALIDATED = 1; -->
				<label class="label-badge"  for="dolibarr-propal-validated">
					<input class="dol-input" type="checkbox" value="1"  id="dolibarr-propal-validated" name="dolibarr-propal-validated" />
					<span id="label-for-dolibarr-propal-validated" >__MSG_dolibarrValidated__</span>
				</label>

				<!-- const STATUS_SIGNED = 2; -->
				<label class="label-badge"  for="dolibarr-propal-signed">
					<input class="dol-input" type="checkbox" value="2"  id="dolibarr-propal-signed" name="dolibarr-propal-signed" />
					<span  id="label-for-dolibarr-propal-signed"  >__MSG_dolibarrSigned__</span>
				</label>
					
				<!-- const STATUS_NOTSIGNED = 3; -->
				<label  class="label-badge" for="dolibarr-propal-notsigned">
					<input class="dol-input" type="checkbox" value="3"  id="dolibarr-propal-notsigned" name="dolibarr-propal-notsigned" />
					<span id="label-for-dolibarr-propal-notsigned" >__MSG_dolibarrNotSigned__</span>
				</label>

				<!-- const STATUS_BILLED = 4; -->
				<label class="label-badge"  for="dolibarr-propal-billed">
					<input class="dol-input" type="checkbox" value="4"  id="dolibarr-propal-billed" name="dolibarr-propal-billed" />
					<span id="label-for-dolibarr-propal-billed">__MSG_dolibarrBilled__</span>
				</label>

			</div>

	</details>

	<p>
		<a id="label-for-link-to-modules-doc" href="https://www.thersane.fr/fr/content/58-nos-modules-dolibarr">__MSG_SeeModuleDoc__</a>
	</p>

	<hr/>
	<button id="save-dolibarr-options" type="submit">__MSG_Save__</button>
	<div id="save-feed-back"></div>
	</form>
	<script type="module" src="options.js"></script>

</div>
</body>

</html>
